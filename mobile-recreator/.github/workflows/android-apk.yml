name: Build Preet Reel Recreator APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile-recreator/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-recreator
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preet-reel-recreator-debug-apk
          path: mobile-recreator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
