name: Build Preet Sports Android APK

on:
  push:
    branches:
      - mobile-reel-recreator
    paths:
      - "mobile-recreator/**"
      - ".github/workflows/preet-reel-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK with Gradle 8.11.1
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.11.1"
          build-root-directory: mobile-recreator
          arguments: --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: preet-sports-mobile-apk
          path: mobile-recreator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
