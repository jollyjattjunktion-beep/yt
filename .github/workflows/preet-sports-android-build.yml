name: Preet Sports Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/automated-video-studio"
      - "feature/offline-cricket-ai"
      - "experiment/hindi-pockettts-voice-clone"
    paths:
      - "video_studio/mobile/**"
      - ".github/workflows/preet-sports-android-build.yml"

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project checkout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          echo "Checking Android project files"
          ls -la "$GITHUB_WORKSPACE/video_studio/mobile"
          test -f "$GITHUB_WORKSPACE/video_studio/mobile/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/video_studio/mobile/build.gradle.kts"

      - name: Build debug APK
        run: gradle -p "$GITHUB_WORKSPACE/video_studio/mobile" :app:assembleDebug --stacktrace

      - name: Verify JNI libraries are packaged in the APK
        shell: bash
        run: |
          APK="video_studio/mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libpreet_pockettts_jni.so" /tmp/apk-contents.txt
          grep -q "lib/armeabi-v7a/libpreet_pockettts_jni.so" /tmp/apk-contents.txt
          mkdir -p /tmp/preet-apk-check
          unzip -q "$APK" 'lib/*/libpreet_pockettts_jni.so' -d /tmp/preet-apk-check
          LLVM_NM="$(find "$ANDROID_HOME/ndk" -type f -name llvm-nm | sort -V | tail -n 1)"
          test -x "$LLVM_NM"
          for ABI in arm64-v8a armeabi-v7a; do
            LIB="/tmp/preet-apk-check/lib/$ABI/libpreet_pockettts_jni.so"
            test -s "$LIB"
            "$LLVM_NM" -D --defined-only "$LIB" | tee "/tmp/$ABI-symbols.txt"
            grep -q "Java_com_preetsports_studio_NativeBuildSmoke_nativeAbiWordSize" "/tmp/$ABI-symbols.txt"
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preet-sports-android-debug-apk
          path: video_studio/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
