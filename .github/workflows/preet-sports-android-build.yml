name: Preet Sports Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/automated-video-studio"
      - "feature/offline-cricket-ai"
      - "experiment/hindi-pockettts-voice-clone"
    paths:
      - "video_studio/mobile/**"
      - ".github/workflows/preet-sports-android-build.yml"

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify Android project checkout
        run: |
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"
          pwd
          ls -la
          echo "Checking Android project files"
          ls -la "$GITHUB_WORKSPACE/video_studio/mobile"
          test -f "$GITHUB_WORKSPACE/video_studio/mobile/settings.gradle.kts"
          test -f "$GITHUB_WORKSPACE/video_studio/mobile/build.gradle.kts"

      - name: Build debug APK
        run: gradle -p "$GITHUB_WORKSPACE/video_studio/mobile" :app:assembleDebug --stacktrace

      - name: Verify JNI libraries are packaged in the APK
        shell: bash
        run: |
          APK="video_studio/mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          unzip -l "$APK" | tee /tmp/apk-contents.txt
          grep -q "lib/arm64-v8a/libpreet_pockettts_jni.so" /tmp/apk-contents.txt
          grep -q "lib/armeabi-v7a/libpreet_pockettts_jni.so" /tmp/apk-contents.txt
          mkdir -p /tmp/preet-apk-check
          unzip -q "$APK" 'lib/*/libpreet_pockettts_jni.so' -d /tmp/preet-apk-check
          LLVM_NM="$(find "$ANDROID_HOME/ndk" -type f -name llvm-nm | sort -V | tail -n 1)"
          test -x "$LLVM_NM"
          for ABI in arm64-v8a armeabi-v7a; do
            LIB="/tmp/preet-apk-check/lib/$ABI/libpreet_pockettts_jni.so"
            test -s "$LIB"
            "$LLVM_NM" -D --defined-only "$LIB" | tee "/tmp/$ABI-symbols.txt"
            grep -q "Java_com_preetsports_studio_NativeBuildSmoke_nativeAbiWordSize" "/tmp/$ABI-symbols.txt"
          done

      - name: Audit ONNX Runtime Android native dependency
        shell: bash
        run: |
          AAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.microsoft.onnxruntime/onnxruntime-android/1.23.2" -type f -name '*.aar' | head -n 1)"
          test -n "$AAR"
          mkdir -p /tmp/ort-aar-audit
          unzip -q "$AAR" -d /tmp/ort-aar-audit
          echo "Resolved ONNX Runtime Android AAR: $AAR"
          find /tmp/ort-aar-audit -maxdepth 4 -type f | sort
          for ABI in arm64-v8a armeabi-v7a; do
            test -s "/tmp/ort-aar-audit/jni/$ABI/libonnxruntime.so"
          done
          test -s /tmp/ort-aar-audit/headers/onnxruntime_cxx_api.h
          test -s /tmp/ort-aar-audit/headers/onnxruntime_c_api.h
          echo "C/C++ headers are present in the AAR."
          NDK_ROOT="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          test -x "$TOOLCHAIN/clang++"
          cat > /tmp/ort-link-smoke.cpp <<'EOF'
          #include <onnxruntime_cxx_api.h>
          extern "C" int preet_ort_link_smoke() {
            Ort::Env env(ORT_LOGGING_LEVEL_WARNING, "preet-ort-link-smoke");
            return env ? 1 : 0;
          }
          EOF
          for ABI in arm64-v8a armeabi-v7a; do
            case "$ABI" in
              arm64-v8a) TARGET="aarch64-linux-android29" ;;
              armeabi-v7a) TARGET="armv7a-linux-androideabi29" ;;
            esac
            "$TOOLCHAIN/clang++" --target="$TARGET" --sysroot="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
              -std=c++17 -fPIC -shared -Wl,--no-undefined \
              -I/tmp/ort-aar-audit/headers \
              /tmp/ort-link-smoke.cpp \
              -L"/tmp/ort-aar-audit/jni/$ABI" -lonnxruntime -llog -ldl \
              -o "/tmp/libpreet_ort_link_smoke_$ABI.so"
            test -s "/tmp/libpreet_ort_link_smoke_$ABI.so"
            echo "ONNX Runtime C++ API compiled and linked for $ABI."
          done

      - name: Build SentencePiece Android static dependency
        shell: bash
        run: |
          git clone --depth 1 --branch v0.2.1 https://github.com/google/sentencepiece.git /tmp/sentencepiece
          NDK_ROOT="$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for ABI in arm64-v8a armeabi-v7a; do
            BUILD="/tmp/sentencepiece-build-$ABI"
            cmake -S /tmp/sentencepiece -B "$BUILD" \
              -DCMAKE_TOOLCHAIN_FILE="$NDK_ROOT/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI="$ABI" \
              -DANDROID_PLATFORM=android-29 \
              -DCMAKE_BUILD_TYPE=Release \
              -DSPM_ENABLE_SHARED=OFF \
              -DSPM_ENABLE_TCMALLOC=OFF \
              -DSPM_PROTOBUF_PROVIDER=internal \
              -DSPM_ABSL_PROVIDER=internal \
              -DSPM_ENABLE_NFKC_COMPILE=OFF \
              -DSPM_BUILD_TEST=OFF
            cmake --build "$BUILD" --target sentencepiece-static --parallel 2
            test -s "$BUILD/src/libsentencepiece.a"
            cat > "/tmp/preet-sentencepiece-link-$ABI.cpp" <<'EOF'
          #include <sentencepiece_processor.h>
          extern "C" int preet_sentencepiece_link_smoke() {
            sentencepiece::SentencePieceProcessor processor;
            return processor.IsInitialized() ? 1 : 0;
          }
          EOF
            case "$ABI" in
              arm64-v8a) TARGET="aarch64-linux-android29" ;;
              armeabi-v7a) TARGET="armv7a-linux-androideabi29" ;;
            esac
            TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
            "$TOOLCHAIN/clang++" --target="$TARGET" --sysroot="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot" \
              -std=c++17 -fPIC -shared -Wl,--no-undefined \
              -I/tmp/sentencepiece/src -I"$BUILD/src" -I/tmp/sentencepiece/third_party \
              "/tmp/preet-sentencepiece-link-$ABI.cpp" "$BUILD/src/libsentencepiece.a" \
              -llog -landroid -o "/tmp/libpreet_sentencepiece_link_$ABI.so"
            test -s "/tmp/libpreet_sentencepiece_link_$ABI.so"
            echo "SentencePiece C++ API compiled and linked for $ABI."
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: preet-sports-android-debug-apk
          path: video_studio/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
