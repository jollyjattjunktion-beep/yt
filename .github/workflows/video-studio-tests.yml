name: Video Studio Tests
on:
  push:
    paths: ["video_studio/**"]
  pull_request:
    paths: ["video_studio/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r video_studio/requirements.txt pytest
      - run: PYTHONPATH=video_studio pytest video_studio/tests
