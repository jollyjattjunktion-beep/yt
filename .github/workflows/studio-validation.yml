name: Studio validation
on:
  pull_request:
    paths:
      - "video_studio/**"
  push:
    branches:
      - "feature/automated-video-studio"
    paths:
      - "video_studio/**"
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -r video_studio/requirements.txt pytest
      - run: pytest -q video_studio/tests
        env:
          DATA_DIR: ./video_studio/test-data
          OUTPUT_DIR: ./video_studio/test-output
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble Android debug APK
        working-directory: video_studio/mobile
        run: gradle :app:assembleDebug
