name: Hindi PocketTTS model pack

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/hindi-pockettts-voice-clone
    paths:
      - .github/workflows/hindi-pockettts-model-pack.yml

permissions:
  contents: read

jobs:
  package-hindi-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face downloader
        run: python -m pip install --upgrade huggingface_hub

      - name: Download official Hindi ONNX model files
        run: |
          hf download saryps-labs/pocket-tts-hindi \
            --include "onnx/*" "NOTICE.md" "MODEL_LICENSE.md" \
            --local-dir model-source

      - name: Verify required Hindi runtime assets
        run: |
          set -euo pipefail
          test -s model-source/onnx/flow_lm_flow_int8.onnx
          test -s model-source/onnx/flow_lm_main_int8.onnx
          test -s model-source/onnx/mimi_decoder_int8.onnx
          test -s model-source/onnx/mimi_encoder.onnx
          test -s model-source/onnx/text_conditioner.onnx
          test -s model-source/onnx/tokenizer.model
          test -s model-source/onnx/bos_before_voice.npy
          test -s model-source/onnx/runtime/README.md || true
          du -sh model-source/onnx

      - name: Create model pack
        run: |
          mkdir -p dist
          cat > dist/README.txt <<'EOF'
          Preet Sports Hindi PocketTTS model pack
          Source: saryps-labs/pocket-tts-hindi
          License: CC BY 4.0 for model artifacts; see included license and NOTICE files.
          This pack contains model assets only, not an Android runtime or the user's voice recording.
          Hindi runtime must prepend bos_before_voice.npy exactly once and disable terminal punctuation.
          Output sample rate: 24000 Hz, mono.
          EOF
          cp model-source/MODEL_LICENSE.md dist/ 2>/dev/null || true
          cp model-source/NOTICE.md dist/ 2>/dev/null || true
          cd model-source
          zip -qr ../dist/preet-hindi-pockettts-onnx.zip onnx
          cd ../dist
          sha256sum preet-hindi-pockettts-onnx.zip > SHA256SUMS.txt

      - name: Upload model pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: preet-hindi-pockettts-model-pack
          path: dist/
          if-no-files-found: error
          retention-days: 14
